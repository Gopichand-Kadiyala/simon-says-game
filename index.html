
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simon Says Game</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Simon Says Game</h1>

    <h2>Press Start to play!</h2>

    <div class="score-container">
        <p>Level: <span id="level">0</span></p>
        <p>High Score: <span id="high-score">0</span></p>
    </div>

    <button id="start-btn" type="button">Start Game</button>

    <div class="btn-container">

        <div class="btn-line-one">
            <button class="btn red" type="button" id="red">1</button>
            <button class="btn green" type="button" id="green">2</button>
        </div>

        <div class="btn-line-two">
            <button class="btn yellow" type="button" id="yellow">3</button>
            <button class="btn blue" type="button" id="blue">4</button>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
